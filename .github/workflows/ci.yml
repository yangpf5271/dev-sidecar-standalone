name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # 单元测试: node:test 秒级失败信号, 先于 3×3 矩阵
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node:test
        run: npm test

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check all source files
        run: |
          set -e
          for f in index.js $(find src -name '*.js'); do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; exit 1; }
          done
          echo "all syntax checks passed"

      - name: npm pack contents check
        run: npm pack --dry-run

      # CLI 子命令测试(代理未启动、证书未生成状态)
      # 断言只匹配 ASCII 内容,避免 Windows 控制台编码问题
      - name: CLI tests (proxy stopped, no cert)
        run: |
          set -e

          # dss env on/off: 三种 shell 格式
          node index.js env on --shell bash        | grep -qx 'export HTTP_PROXY=http://127.0.0.1:31180'
          node index.js env on --shell cmd         | grep -qx 'set HTTP_PROXY=http://127.0.0.1:31180'
          node index.js env on --shell powershell  | grep -q  "\$env:HTTP_PROXY='http://127.0.0.1:31180'"
          node index.js env off --shell bash       | grep -qx 'unset HTTP_PROXY'

          # eval 真实生效验证
          eval "$(node index.js env on --shell bash)"
          test "$HTTP_PROXY" = 'http://127.0.0.1:31180'
          test "$HTTPS_PROXY" = 'http://127.0.0.1:31181'
          eval "$(node index.js env off --shell bash)"
          test -z "$HTTP_PROXY"

          # dss npm on/off 全周期 + 配置断言
          node index.js npm on > /dev/null 2>&1
          test "$(npm config get proxy)" = 'http://127.0.0.1:31180'
          test "$(npm config get https-proxy)" = 'http://127.0.0.1:31180'
          node index.js npm off > /dev/null 2>&1
          test "$(npm config get proxy)" = 'null'

          # dss git on --simple + off
          node index.js git on --simple > /dev/null 2>&1
          test "$(git config --global --get http.proxy)" = 'http://127.0.0.1:31180'
          node index.js git off > /dev/null 2>&1
          test -z "$(git config --global --get http.proxy)"

          # 证书未生成时: git on 完整模式应失败且 exit code = 1
          if node index.js git on > /dev/null 2>&1; then
            echo "FAIL: git on should exit 1 when CA cert is not generated"; exit 1
          fi

          # 不支持的 shell 应报错
          if node index.js env on --shell fish > /dev/null 2>&1; then
            echo "FAIL: unsupported shell should be rejected"; exit 1
          fi

          # 未知命令: 应打印可用命令列表并以 exit 1 退出,而不是 ENOENT 崩溃
          # (注意 -o pipefail: 不能把预期 exit 1 的命令直接接进管道)
          if node index.js state > /dev/null 2>&1; then
            echo "FAIL: unknown command should exit 1"; exit 1
          fi
          OUT=$(node index.js state 2>&1) || true
          echo "$OUT" | grep -q 'dss start' || { echo "FAIL: unknown command should print usage"; exit 1; }

          # -c 指定的配置文件不存在: 友好报错
          if node index.js -c nope.json > /dev/null 2>&1; then
            echo "FAIL: missing config file should exit 1"; exit 1
          fi
          OUT=$(node index.js -c nope.json 2>&1) || true
          echo "$OUT" | grep -q 'nope.json' || { echo "FAIL: missing config message"; exit 1; }

          # v1.5.0: 未知选项报错而不是静默启动 (如 dss -help 曾直接拉起代理)
          if node index.js -help > /dev/null 2>&1; then
            echo "FAIL: unknown option should exit 1"; exit 1
          fi
          OUT=$(node index.js -help 2>&1) || true
          echo "$OUT" | grep -q 'dss --help' || { echo "FAIL: unknown option should hint help"; exit 1; }

          # v1.5.0: 位置参数配置文件旧用法已移除, 存在的文件也按未知命令报错
          if node index.js config/default.json > /dev/null 2>&1; then
            echo "FAIL: positional config arg should be rejected"; exit 1
          fi

          # 全景状态面板: 停止状态+无证书+无任何工具配置时应正常退出
          node index.js status > /dev/null

          echo "CLI tests (stopped) passed"

      # 启动冒烟 + 端到端 + 证书生成后的完整模式
      - name: Startup smoke + end-to-end + full mode
        run: |
          set -e

          node index.js > proxy.log 2>&1 &
          PROXY_PID=$!

          # 等待代理就绪(最多 30 秒,用真实代理请求探测)
          READY=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -m 3 -x http://127.0.0.1:31180 http://example.com; then
              READY=1; break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "FAIL: proxy did not become ready"; cat proxy.log; exit 1
          fi
          echo "proxy ready (PID: $PROXY_PID)"

          # v1.5.0: 端口被占用时第二个实例必须以非零退出, 不能假报"启动成功"
          if node index.js > dup.log 2>&1; then
            echo "FAIL: duplicate instance should exit non-zero"; cat dup.log; exit 1
          fi
          grep -q 'EADDRINUSE' dup.log || { echo "FAIL: duplicate should report EADDRINUSE"; cat dup.log; exit 1; }
          if grep -q '启动成功' dup.log; then
            echo "FAIL: duplicate must not claim success"; cat dup.log; exit 1
          fi
          rm -f dup.log

          # 端到端: 普通隧道代理(非拦截域名,无需证书)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 20 -x http://127.0.0.1:31180 http://example.com)
          test "$CODE" = '200'
          echo "e2e tunnel proxy: HTTP $CODE"

          # 证书应已自动生成
          test -f "$HOME/.dev-sidecar/dev-sidecar.ca.crt"
          echo "CA cert generated"

          # 证书生成后: git on 完整模式应成功, 且写入绝对路径
          node index.js git on > /dev/null 2>&1
          test "$(git config --global --get https.proxy)" = 'http://127.0.0.1:31181'
          CERT_PATH=$(git config --global --get http.sslCAInfo)
          case "$CERT_PATH" in
            "~"*) echo "FAIL: sslCAInfo should be absolute path, got: $CERT_PATH"; exit 1;;
          esac
          test -f "$CERT_PATH"
          node index.js git off > /dev/null 2>&1

          # 证书生成后: npm on --mitm 应成功
          node index.js npm on --mitm > /dev/null 2>&1
          test "$(npm config get https-proxy)" = 'http://127.0.0.1:31181'
          test -f "$(npm config get cafile)"
          node index.js npm off > /dev/null 2>&1

          kill $PROXY_PID 2>/dev/null || true
          sleep 1
          echo "startup + e2e + full mode passed"

      # CA 私钥权限检查(仅类 Unix;Windows 无此权限模型)
      - name: CA private key permission check
        if: runner.os != 'Windows'
        run: |
          set -e
          PERM=$(ls -l "$HOME/.dev-sidecar/dev-sidecar.ca.key.pem" | cut -c1-10)
          if [ "$PERM" != "-rw-------" ]; then
            echo "FAIL: CA key permission is $PERM, expected -rw-------"; exit 1
          fi
          echo "CA key permission ok: $PERM"

      # 守护进程管理 + 智能恢复测试
      # 关键不变量: 预埋的第三方代理值绝不能被误删
      - name: Daemon start/stop + smart restore
        run: |
          set -e

          # 预埋第三方代理值(占 dss 不覆盖的键: npm cafile / git https.proxy)
          # 注意: npm 对路径类配置会归一化(相对路径解析为绝对路径),
          # 断言用「前后值一致」而非字面值
          npm config set cafile corp-ca.crt
          git config --global https.proxy http://corp-proxy.example:8080
          CAFILE_BEFORE=$(npm config get cafile)

          # 守护启动: PID 文件应出现
          node index.js start | grep "Daemon PID"
          for i in $(seq 1 30); do
            [ -f "$HOME/.dev-sidecar/dev-sidecar.pid" ] && break
            sleep 1
          done
          test -f "$HOME/.dev-sidecar/dev-sidecar.pid"
          DAEMON_PID=$(cat "$HOME/.dev-sidecar/dev-sidecar.pid")
          echo "daemon started, pid: $DAEMON_PID"

          # dss 写入配置(简单模式: npm 设 proxy/https-proxy, git 设 http.proxy)
          node index.js npm on > /dev/null 2>&1
          node index.js git on --simple > /dev/null 2>&1
          test "$(npm config get proxy)" = 'http://127.0.0.1:31180'

          # 模拟 dss docker on 注入的构建层代理(auths 代表用户自己的仓库凭据)
          mkdir -p "$HOME/.docker"
          cat > "$HOME/.docker/config.json" <<'JSON'
          {
            "auths": { "corp-registry.example:5000": { "auth": "eHg6eHg=" } },
            "proxies": {
              "default": {
                "httpProxy": "http://host.docker.internal:31180",
                "httpsProxy": "http://host.docker.internal:31180",
                "noProxy": "corp-registry.example:5000"
              }
            }
          }
          JSON

          # stop: 进程终止 + 自己的配置恢复 + 第三方值原样
          node index.js stop | grep -E "已停止|已恢复"
          for i in $(seq 1 15); do
            kill -0 "$DAEMON_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$DAEMON_PID" 2>/dev/null; then
            echo "FAIL: daemon still alive after stop"; exit 1
          fi
          test ! -f "$HOME/.dev-sidecar/dev-sidecar.pid"
          test "$(npm config get proxy)" = 'null'
          test "$(npm config get https-proxy)" = 'null'
          test -z "$(git config --global --get http.proxy)"
          # 第三方值不受影响(前后值一致)
          test "$(npm config get cafile)" = "$CAFILE_BEFORE"
          test "$(git config --global --get https.proxy)" = 'http://corp-proxy.example:8080'

          # docker 构建层代理应被恢复(指向本代理端口), auths 严格保留
          node -e "const c=JSON.parse(require('fs').readFileSync(process.env.HOME+'/.docker/config.json','utf8')); if(c.proxies){console.error('FAIL: docker proxies not removed');process.exit(1)} if(!c.auths||!c.auths['corp-registry.example:5000']){console.error('FAIL: docker auths lost');process.exit(1)} console.log('docker build proxy cleaned, auths kept')"

          # 日志文件应有内容
          test -s "$HOME/.dev-sidecar/logs/dev-sidecar.log"

          # restore 幂等
          node index.js restore > /dev/null 2>&1
          node index.js restore > /dev/null 2>&1

          # docker 第三方代理(非本代理端口)不受 restore 影响
          cat > "$HOME/.docker/config.json" <<'JSON'
          { "proxies": { "default": { "httpProxy": "http://corp-proxy.example:8080" } } }
          JSON
          node index.js restore > /dev/null 2>&1
          node -e "const c=JSON.parse(require('fs').readFileSync(process.env.HOME+'/.docker/config.json','utf8')); if(!c.proxies||c.proxies.default.httpProxy!=='http://corp-proxy.example:8080'){console.error('FAIL: foreign docker proxy touched');process.exit(1)} console.log('foreign docker proxy untouched')"
          rm -f "$HOME/.docker/config.json"

          # 清理第三方测试值
          npm config delete cafile
          git config --global --unset https.proxy

          echo "daemon start/stop + smart restore passed"

      # 镜像源切换测试: 核心不变量是企业源快照保护
      - name: Mirror switch tests (npm + pip)
        run: |
          set -e

          # 预埋企业源(off 后必须恢复到它,而不是官方源)
          npm config set registry https://registry.corp.example/
          node index.js npm mirror npmmirror | grep "已切换"
          test "$(npm config get registry)" = 'https://registry.npmmirror.com'

          # 重复切换不同镜像,快照不应被覆盖
          node index.js npm mirror ustc > /dev/null
          test "$(npm config get registry)" = 'https://npmreg.proxy.ustclug.org'

          # off 恢复企业源(快照保护断言)
          node index.js npm mirror off | grep "已恢复"
          test "$(npm config get registry)" = 'https://registry.corp.example/'

          # 清理
          npm config delete registry

          # pip(runner 无 pip 时跳过; runner pip 原本无源, off 走"清除"分支)
          if command -v pip3 >/dev/null 2>&1 || command -v pip >/dev/null 2>&1; then
            node index.js pip mirror aliyun | grep "已切换"
            node index.js pip mirror off | grep -E "已恢复|已清除"
          else
            echo "pip not available on this runner, skipped"
          fi

          echo "mirror switch tests passed"

      # Docker 构建层: proxies 注入 + auths 保护 + noProxy 聚合
      - name: Docker build-layer proxy tests
        run: |
          set -e

          # 预埋含内网 registry auths 的 config.json(必须逐字保留)
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"corp-registry.example:5000":{"auth":"dGVzdA=="}}}' > "$HOME/.docker/config.json"

          node index.js docker on | grep "✅"
          node -e "
            const c = require(process.env.HOME + '/.docker/config.json')
            const p = c.proxies && c.proxies.default
            const ok = p && p.httpProxy.startsWith('http://') &&
              Object.keys(c.auths).length === 1 &&
              p.noProxy.includes('corp-registry.example') &&
              p.noProxy.includes('127.0.0.1')
            if (!ok) { console.error('FAIL: proxies/auths/noProxy assertion'); process.exit(1) }
            console.log('proxies + auths + noProxy ok')
          "

          node index.js docker off | grep "✅"
          node -e "
            const c = require(process.env.HOME + '/.docker/config.json')
            if (c.proxies) { console.error('FAIL: proxies should be removed'); process.exit(1) }
            if (Object.keys(c.auths).length !== 1) { console.error('FAIL: auths lost'); process.exit(1) }
            console.log('off: proxies removed, auths preserved')
          "

          echo "docker build-layer tests passed"

      # Docker 拉取层: daemon.json 真实读取链路 (docker-pull 模块 readLocal + parseMirrors, 零网络不 flaky)
      - name: Docker pull-layer read path (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json <<'JSON'
          { "registry-mirrors": ["https://mirror-ci.example", "https://mirror-ci2.example"] }
          JSON
          node index.js status | grep -q 'mirror-ci.example 等 2 个'
          sudo rm -f /etc/docker/daemon.json
          node index.js status > /dev/null
          echo "docker pull-layer read path passed"
